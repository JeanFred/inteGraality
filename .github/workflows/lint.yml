name: Lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.4"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.4"
          args: "format --diff"
