[tools]
uv = "latest"
pre-commit = "latest"

[settings]
python.uv_venv_auto = "source"

[env]
_.file = ".env"

[tasks.test]
description = "Run tests"
run = "uv run pytest"

[tasks.test-functional-sparql]
description = "Run functional SPARQL tests against live endpoints, e.g. mise run test-functional-sparql qlever (default: both)"
usage = 'arg "[engine]" help="Endpoint filter passed to pytest -k" default="qlever or wdqs"'
run = 'uv run pytest integraality/tests/test_sparql_functional.py -m functional -k "${usage_engine}" -s -q --tb=line'

[tasks.lint]
description = "Run all pre-commit hooks"
run = "pre-commit run --all-files"

[tasks.up]
description = "Start Flask app and Redis via Docker Compose"
run = "docker compose up -d --remove-orphans"

[tasks.down]
description = "Stop Flask app and Redis via Docker Compose"
run = "docker compose down"

[tasks.reset-db]
description = "Drop and recreate the local database so the schema is reapplied on next request"
run = "docker compose exec -T db mariadb -u\"$DB_USER\" -p\"$DB_PASSWORD\" -e \"DROP DATABASE IF EXISTS \\`$DB_NAME\\`; CREATE DATABASE \\`$DB_NAME\\`;\""

[tasks.connect-db]
description = "Open an interactive MariaDB shell on the local database"
run = "docker compose exec -it db mariadb -u\"$DB_USER\" -p\"$DB_PASSWORD\" \"${DB_NAME}\""

[tasks.query-db]
description = "Run a SQL query against the local database, e.g. mise run query-db 'SELECT * FROM pages'"
usage = 'arg "<query>" help="SQL query to run"'
run = 'docker compose exec -T db mariadb -u"$DB_USER" -p"$DB_PASSWORD" "${DB_NAME}" -e "${usage_query?}"'
