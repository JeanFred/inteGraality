---
- name: Deploy inteGraality to Toolforge
  hosts: toolforge
  gather_facts: false

  vars:
    tool_name: integraality
    base_path: "/data/project/{{ tool_name }}"
    logs_path: "{{ base_path }}/logs"
    checkout_path: "{{ base_path }}/integraality"
    toolforge_path: "{{ base_path }}/www/python"
    virtualenv_path: "{{ toolforge_path }}/venv"
    source_path: "{{ toolforge_path }}/src"
    jobs_file_path: "{{ base_path }}/jobs.yml"

    runtime_image: python3.11

    jobs:
      - name: weekly-update-wikidata
        command: "{{ checkout_path }}/bin/run.sh wikidata"
        image: "{{ runtime_image }}"
        schedule: "@weekly"
        emails: all
        mem: 1G
        filelog-stdout: logs/weekly-update-wikidata-out.log
        filelog-stderr: logs/weekly-update-wikidata-err.log

    service_template:
      backend: kubernetes
      type: "{{ runtime_image }}"
      health-check-path: /healthz
      mem: 1Gi

  handlers:
    - name: Restart webservice
      ansible.builtin.command: >
        webservice restart
      changed_when: true

    - name: Generate deploy messages
      ansible.builtin.command: >
        {{ checkout_path }}/bin/sal_messages_from_git_log.sh {{ git_result.before }}..{{ git_result.after }}
      args:
        chdir: "{{ checkout_path }}"
      register: deploy_messages
      changed_when: true
      listen: Log deploy to SAL

    - name: Send deploy messages to Server Admin Log
      ansible.builtin.command: >
        dologmsg "{{ item }}"
      loop: "{{ deploy_messages.stdout_lines }}"
      loop_control:
        pause: 1
      changed_when: true
      listen: Log deploy to SAL

    - name: Load Toolforge jobs from file
      ansible.builtin.command: >
        toolforge jobs load {{ jobs_file_path }}
      register: jobs_load_result
      changed_when: "'created' in jobs_load_result.stdout or 'updated' in jobs_load_result.stdout"

  tasks:
    - name: Ensure directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "02755"
      with_items:
        - "{{ logs_path }}"
        - "{{ toolforge_path }}"
      tags:
        - paths

    - name: Clone Git repository
      ansible.builtin.git:
        repo: 'https://github.com/JeanFred/integraality'
        dest: '{{ checkout_path }}'
      register: git_result
      notify:
        - Restart webservice
        - Log deploy to SAL
      tags:
        - git
        - skip_ansible_lint  # Skip E401, we always want latest version

    # - name: Install requirements
    #   pip:
    #     requirements: '{{ checkout_path }}/requirements.txt'
    #     virtualenv: '{{ virtualenv_path }}'
    #   tags:
    #     - requirements

    - name: Deploy uwsgi configuration file
      ansible.builtin.template:
        src: 'uwsgi.ini.j2'
        dest: '{{ toolforge_path }}/uwsgi.ini'
        mode: "0755"
      tags:
        - config

    - name: Deploy service.template file
      ansible.builtin.copy:
        content: '{{ service_template | to_nice_yaml }}'
        dest: '{{ base_path }}/service.template'
        mode: "0644"
      tags:
        - config
      notify:
        - Restart webservice

    - name: Symlink src directory
      ansible.builtin.file:
        src: '{{ checkout_path }}'
        path: '{{ source_path }}'
        state: link
      tags:
        - paths

    - name: Weekly job updating all dashboards on Wikidata
      ansible.builtin.copy:
        content: '{{ jobs | to_nice_yaml(sort_keys=false) }}'
        dest: '{{ jobs_file_path }}'
        mode: "0644"
      notify:
        - Load Toolforge jobs from file
      tags:
        - jobs
