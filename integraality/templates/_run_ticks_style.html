{# Shared appearance for run-tick strips; .run-strip container is per-page. #}
<style>
    .run-tick {
        box-sizing: border-box;
        position: relative; /* anchors the history strip's × glyph (::after) */
        width: 11px;
        height: 14px;
        border-radius: 2px;
    }
    .run-tick-ok {
        background-color: var(--bs-success);
    }
    .run-tick-fail {
        background-color: var(--bs-danger);
    }
    /* Null edit: OK but no revision — hollow green marks "no change". */
    .run-tick-null {
        border: 1.5px solid var(--bs-success);
        background-color: transparent;
    }
</style>
