<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InteGraality - dashboard for Wikidata properties</title>
    <link rel="stylesheet" href="//tools-static.wmflabs.org/cdnjs/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" />
    <script src="//tools-static.wmflabs.org/cdnjs/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js" type="text/javascript"></script>
    {% block head_scripts %}{% endblock %}
    <style>
    :root {
        /* Classic sans stack (matches the pre-BS5 look) instead of OS system-ui. */
        --bs-body-font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    /* BS5.3 underlines links by default; underline on hover only.
       Scoped to unclassed anchors so BS components keep their own decoration. */
    a:not([class]) {
        text-decoration: none;
    }

    a:not([class]):hover {
        text-decoration: underline;
    }

    dl.row dd {
        padding-bottom: 10px;
        margin-bottom: 10px;
    }

    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    main {
        flex: 1;
    }
    </style>
</head>

<body>
    <nav class="navbar bg-body-tertiary border-bottom" aria-label="Main navigation">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="{{ url_for('index') }}">InteGraality</a>
            <a href="//toolforge.org" class="d-flex align-items-center" title="Powered by Wikimedia Toolforge">
                <img src="//upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Toolforge_logo.svg/40px-Toolforge_logo.svg.png"
                     alt="Powered by Wikimedia Toolforge" width="40" height="40" />
            </a>
        </div>
    </nav>

    <main class="py-4">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block body_scripts %}{% endblock %}

    <footer class="border-top py-3 small">
        <div class="container">
            <div class="d-flex justify-content-between flex-wrap gap-3">
                <span>Source available on <a href="https://github.com/JeanFred/integraality/">GitHub</a> (mirrored on <a href="https://phabricator.wikimedia.org/source/tool-integraality/">Wikimedia Phabricator</a>)</span>
                <ul class="list-inline mb-0">
                    <li class="list-inline-item"><a href="https://phabricator.wikimedia.org/maniphest/task/create/?projects=tool-integraality">Report a bug</a></li>
                    <li class="list-inline-item"><a href="https://phabricator.wikimedia.org/tag/tool-integraality/">Open tasks</a></li>
                    <li class="list-inline-item"><a href="https://sal.toolforge.org/tools.integraality">Server Admin log</a></li>
                </ul>
            </div>
        </div>
    </footer>
</body>

</html>
