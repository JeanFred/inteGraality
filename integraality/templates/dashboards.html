{% extends "base.html" %}
{% block head_scripts %}
    <script src="//tools-static.wmflabs.org/cdnjs/ajax/libs/htmx/2.0.10/htmx.min.js"></script>
    {# Tom Select: enhances the multi-value "Selector mentions" <select> into a
       tag input. Bootstrap5 theme so it matches the form controls. Pinned, from
       the Toolforge cdnjs mirror (same source as the other client assets). The
       library JS is loaded in body_scripts, right before its init. #}
    <link
        rel="stylesheet"
        href="//tools-static.wmflabs.org/cdnjs/ajax/libs/tom-select/2.4.1/css/tom-select.bootstrap5.min.css"
    >
    {% include "_run_ticks_style.html" %}
    <style>
        .browse-filter {
            width: 180px;
        }
        .browse-filter-ns {
            width: 160px;
        }
        .htmx-request {
            opacity: 0.5;
            transition: opacity 200ms ease-in;
        }
        /* One dashboard's recent runs: a single bounded flex row (no wrap).
           The cell uses .align-middle to centre this against the text cells. */
        .run-strip {
            display: flex;
            gap: 2px;
            line-height: 1;
        }
        /* Tier-2 feature facets. Layout (flex/wrap/gap/border) is Bootstrap
           utilities in the markup; only the bits utilities can't express stay
           here: the full-width uppercase group label and the field min-width. */
        .feature-facets > summary {
            width: fit-content;
            cursor: pointer;
        }
        .facet-group-label {
            flex-basis: 100%;
            font-weight: 600;
            font-size: 0.7rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .facet-field > label {
            color: var(--bs-secondary-color);
            font-size: 0.72rem;
            white-space: nowrap;
        }
        .facet-field .form-select-sm,
        .facet-field .form-control-sm {
            min-width: 9rem;
        }
    </style>
{% endblock %}
{% block body_scripts %}{% include "_timeago.html" %}{% include "_tom_select.html" %}{% endblock %}
{% block content %}
    <h1>Browse dashboards</h1>

    {# hx-history="false": the browse filter uses hx-push-url for shareable URLs,
       but DON'T snapshot the DOM into htmx's history cache — the Tom Select
       widget's injected DOM doesn't round-trip through a cached snapshot (it
       raised htmx:historyCacheError and could restore a stale widget). Back
       re-requests from the server, which is correct for this filter page. #}
    <div id="browse-content" hx-history="false">
        {% include "_browse_inner.html" %}
    </div>
{% endblock %}
