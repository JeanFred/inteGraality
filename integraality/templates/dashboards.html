{% extends "base.html" %}
{% block head_scripts %}
    <script src="//tools-static.wmflabs.org/cdnjs/ajax/libs/htmx/2.0.10/htmx.min.js" type="text/javascript"></script>
    <style>
    .browse-filter { width: 180px; }
    .browse-filter-ns { width: 160px; }
    .htmx-request {
        opacity: 0.5;
        transition: opacity 200ms ease-in;
    }
    .run-strip { white-space: nowrap; line-height: 1; }
    .run-tick {
        display: inline-block;
        width: 11px;
        height: 15px;
        margin-right: 2px;
        border-radius: 2px;
        vertical-align: middle;
        box-sizing: border-box;
    }
    .run-tick-ok { background-color: #3c763d; }    /* Bootstrap success green */
    .run-tick-fail { background-color: #a94442; }  /* Bootstrap danger red */
    /* Null edit: succeeded but produced no revision. Hollow green = "OK but
       empty" — same health hue as OK, visibly unfilled to flag no change. */
    .run-tick-null {
        background-color: transparent;
        border: 1.5px solid #3c763d;
    }
    </style>
{% endblock %}
{% block body_scripts %}{% include "_timeago.html" %}{% endblock %}
{% block content %}
<h1>Browse dashboards</h1>

<div id="browse-content">
    {% include "_browse_inner.html" %}
</div>
{% endblock %}
