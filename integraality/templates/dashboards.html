{% extends "base.html" %}
{% block head_scripts %}
    <script src="//tools-static.wmflabs.org/cdnjs/ajax/libs/htmx/2.0.10/htmx.min.js"></script>
    {% include "_run_ticks_style.html" %}
    <style>
        .browse-filter {
            width: 180px;
        }
        .browse-filter-ns {
            width: 160px;
        }
        .htmx-request {
            opacity: 0.5;
            transition: opacity 200ms ease-in;
        }
        /* Single bounded row (one dashboard's recent runs) — no wrap. */
        .run-strip {
            display: flex;
            gap: 2px;
            line-height: 1;
        }
    </style>
{% endblock %}
{% block body_scripts %}{% include "_timeago.html" %}{% endblock %}
{% block content %}
    <h1>Browse dashboards</h1>

    <div id="browse-content">
        {% include "_browse_inner.html" %}
    </div>
{% endblock %}
