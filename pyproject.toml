[project]
name = "integraality"
version = "0.0.1"
requires-python = "~=3.11.0"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "flask",
  "mwparserfromhell",
  "pymysql",
  "pywikibot",
  "rdflib>=7,<8",
  "redis",
  "toolforge",
]

[dependency-groups]
dev = [
  "fakeredis",
  "pytest",
  "pytest-cov",
]

[tool.uv]
package = false

[tool.ruff]
lint.extend-select = [ "E4", "E7", "E9", "F", "I" ]
lint.ignore = [
  "BLE001", # broad `except Exception` is intentional at error boundaries
  "DTZ001", # datetimes are deliberately naive-UTC to match MariaDB DATETIME columns
  "DTZ007",
  "FLY002", # join-to-f-string hurts readability of multi-line SPARQL test fixtures
]

[tool.pytest]
ini_options.addopts = "-m 'not functional'"
ini_options.markers = [
  "functional: hits live SPARQL endpoints (WDQS/QLever) — slow, needs network",
]

[tool.sqlfluff]
core.dialect = "mariadb"
core.max_line_length = 120
# RF04 (Keywords should not be used as identifiers) flags common valid names
core.exclude_rules = "RF04"
