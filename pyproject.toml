[project]
name = "integraality"
version = "0.0.1"
requires-python = "~=3.11.0"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "flask",
  "mwparserfromhell",
  "pymysql",
  "pywikibot",
  "redis",
  "toolforge",
]

[dependency-groups]
dev = [
  "fakeredis",
  "pytest",
  "pytest-cov",
]

[tool.uv]
package = false

[tool.ruff]
lint.extend-select = [ "I" ]

[tool.pytest]
ini_options.addopts = "-m 'not functional'"
ini_options.markers = [
  "functional: hits live SPARQL endpoints (WDQS/QLever) — slow, needs network",
]

[tool.sqlfluff]
core.dialect = "mariadb"
core.max_line_length = 120
